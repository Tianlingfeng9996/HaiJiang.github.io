# Site identity
locale: "en-US"
site_theme: "default"
title: "Hai Jiang"
title_separator: "·"
name: &name "Hai Jiang"
description: &description "Assistant Professor at the University of Electro-Communications working on adaptive myoelectric prosthetic hands, biosignal intelligence, and compliant mechanisms."
url: "https://tianlingfeng9996.github.io"
baseurl: "/HaiJiang.github.io"
repository: "Tianlingfeng9996/HaiJiang.github.io"
timezone: "Asia/Tokyo"

# Author profile
author:
  avatar: "SelfIntroPicture.png"
  name: "Hai Jiang"
  bio: "Assistant Professor · Myoelectric prosthetics · Human–robot interfaces"
  location: "Tokyo, Japan"
  employer: "The University of Electro-Communications"
  uri: "https://researchers.uec.ac.jp/search/detail.html?lang=en&st=researcher&systemId=0aff72fc8975646f520e17560c007669"
  email: "jianghai@uec.ac.jp"
  orcid: "https://orcid.org/0000-0001-7387-8867"
  github: "Tianlingfeng9996"

# Page behavior
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false
atom_feed:
  hide: true
og_image: "SelfIntroPicture.png"

# SEO / structured profile
social:
  type: "Person"
  name: "Hai Jiang"
  links:
    - "https://orcid.org/0000-0001-7387-8867"
    - "https://github.com/Tianlingfeng9996"
    - "https://researchers.uec.ac.jp/search/detail.html?lang=en&st=researcher&systemId=0aff72fc8975646f520e17560c007669"

# Analytics (disabled until a tracking ID is supplied)
analytics:
  provider: "false"

# Files processed by Jekyll
include:
  - _pages
exclude:
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - _drafts
  - _portfolio
  - _posts
  - _publications
  - _talks
  - _teaching
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html
  - assets/js/_main.js
  - assets/js/plugins
  - Dockerfile
  - Gemfile
  - LICENSE
  - markdown_generator
  - node_modules
  - package.json
  - README.md
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:title/

# GitHub Pages compatible plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
